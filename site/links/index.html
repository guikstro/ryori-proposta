<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ryori · links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Ryori, link da bio: a parede do balcão. Em casas japonesas o cardápio fica pendurado em plaquinhas de madeira (fuda).
   Aqui cada plaquinha é um link, escrita na vertical. A reserva é o único bloco escuro. */
:root{--pedra:#E7E6E1;--sumi:#1D1C1A;--sumi-2:#55534D;--cobre:#7E5226;--madeira:#D8BE96;--madeira-2:#C7A77A;--regra:#C9C6BC;
 --serif:'Shippori Mincho',serif;--sans:'Zen Kaku Gothic New',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pedra);color:var(--sumi);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--cobre);outline-offset:2px}
.demo{background:var(--sumi);color:var(--pedra);font-size:12.5px;text-align:center;padding:6px 12px}
.pg{max-width:440px;margin:0 auto;padding:0 20px 36px}
.topo{display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 16px}
.topo .k{font-family:var(--serif);font-weight:600;font-size:56px;line-height:1;color:var(--cobre);letter-spacing:.04em}
.topo img{height:58px;width:auto;filter:invert(1);mix-blend-mode:multiply}
.casas{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--sumi)}
.casas button{background:none;border:0;font:inherit;color:var(--sumi-2);text-align:left;padding:12px 0 10px;min-height:66px;cursor:pointer}
.casas button+button{padding-left:16px;border-left:1px solid var(--regra)}
.casas b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;color:var(--sumi-2)}
.casas small{font-size:13.5px}
.casas button[aria-pressed=true] b{color:var(--sumi)}
.casas button[aria-pressed=true] small{color:var(--cobre)}
.reservar{display:flex;align-items:center;justify-content:center;min-height:58px;background:var(--sumi);color:var(--pedra);font:500 17px var(--sans)}

/* a parede: trilho escuro, plaquinhas penduradas */
.parede{margin-top:30px;position:relative;padding-top:14px}
.parede::before{content:'';position:absolute;left:-6px;right:-6px;top:6px;height:6px;background:var(--sumi)}
.fuda{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.fuda a{position:relative;height:200px;background:
  repeating-linear-gradient(90deg,rgba(120,80,40,.06) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,var(--madeira),var(--madeira-2));
  display:flex;justify-content:center;padding:16px 0 10px;transition:transform .25s;transform-origin:50% -10px}
.fuda a::before{content:'';position:absolute;top:-9px;left:50%;width:6px;height:12px;margin-left:-3px;background:var(--sumi);border-radius:2px}
.fuda a span{writing-mode:vertical-rl;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.06em;color:var(--sumi);white-space:nowrap}
.fuda a small{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#5a4630}
.fuda a:hover,.fuda a:focus-visible{transform:rotate(-3deg)}
@media (prefers-reduced-motion:reduce){.fuda a{transition:none}}
.dica{font-size:13.5px;color:var(--sumi-2);margin-top:10px}
footer{margin-top:22px;font-size:12.5px;color:var(--sumi-2)}
</style>
</head>
<body>
<div class="demo">Protótipo da Timeless para o Ryori. Não é a página oficial da casa.</div>
<div class="pg">
  <div class="topo">
    <div class="k" lang="ja" aria-label="料理, ryōri: cozinhar">料理</div>
    <img src="https://static.wixstatic.com/media/404bb8_7d5670b5bc4c471db1008a3949596d86~mv2.png/v1/fill/w_600,h_440,al_c,q_85/ryori.png" alt="Ryori" width="79" height="58">
  </div>
  <div class="casas" id="casas" role="group" aria-label="Escolha a casa"></div>
  <a class="reservar" id="reservar" href="../#balcao">Reservar lugar</a>

  <div class="parede">
    <nav class="fuda" aria-label="Links">
      <a href="../#cardapio"><span>Cardápio</span></a>
      <a href="../#mesa"><span>O sushiman sugere</span></a>
      <a href="../?lang=en#cardapio" lang="en"><span>English menu</span></a>
      <a href="https://ifoodbr.onelink.me/F4X4/Ryorisushi" target="_blank" rel="noopener"><span>Pedir no iFood</span></a>
      <a id="mapa" href="#" target="_blank" rel="noopener"><span>Como chegar</span></a>
      <a id="trip" href="#" target="_blank" rel="noopener"><span>Avaliações</span><small>4,9</small></a>
    </nav>
  </div>
  <p class="dica" id="end"></p>
  <footer>Ryori, do Grupo Social Clube. Horários da bio do Instagram, 24/11/2026.</footer>
</div>
<script src="../marca.js"></script>
<script src="../comum.js"></script>
<script>
const CH=MARCA.id+'-casa';
let casa=(()=>{try{return localStorage.getItem(CH)}catch(e){return null}})();
if(!unidade(casa))casa=MARCA.unidades[0].id;
const est=u=>{const s=estadoUnidade(u);return s.k==='aberta'?`aberta até ${hm(s.ate)}`:s.k==='pausa'?`volta às ${hm(s.abre)}`:s.k==='antes'?`abre às ${hm(s.abre)}`:`abre amanhã, ${hm(s.abre)}`;};
function pinta(){
  const u=unidade(casa);
  document.getElementById('casas').innerHTML=MARCA.unidades.map(x=>`<button type="button" data-c="${x.id}" aria-pressed="${x.id===casa}"><b>${x.nome}</b><small>${est(x)}</small></button>`).join('');
  const r=document.getElementById('reservar');r.href=`../?casa=${u.id}#balcao`;r.textContent=`Reservar lugar no ${u.nome}`;
  document.getElementById('mapa').href=u.mapa;
  document.getElementById('end').textContent=`${u.nome}: ${u.end}`;
}
document.getElementById('casas').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;casa=b.dataset.c;try{localStorage.setItem(CH,casa)}catch(e){}pinta();});
document.getElementById('trip').href=MARCA.trip;
pinta();setInterval(pinta,60000);
</script>
</body>
</html>
