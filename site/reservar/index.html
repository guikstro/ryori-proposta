<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14110e">
<title>Reservar · Ryori</title>
<meta name="description" content="Reserve o seu lugar no Ryori, Buganvília ou Iguatemi: no balcão, de frente para o sushiman, ou numa mesa.">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../estilo.css">
<style>
/* Endereço próprio da reserva (ryori.com.br/reservar): a mesma triagem do site e da bio, sozinha na página. */
.demo{position:fixed;z-index:60;left:0;right:0;bottom:0;font-size:9.5px;text-align:center;padding:5px 10px;background:var(--nogueira);color:var(--creme-3);border-top:1px dashed var(--cortica)}
.demo b{font-weight:500;color:var(--brasa)}
.topo{display:flex;justify-content:space-between;align-items:center;padding:20px 28px}
.pg{max-width:1200px;margin:0 auto;padding:40px 28px 110px}
.pg>.cab{display:grid;grid-template-columns:1fr 1fr;gap:var(--g);align-items:end}
@media (max-width:900px){.topo{padding:16px}.pg{padding:24px 16px 100px}.pg>.cab{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demo">Protótipo da <b>Timeless</b> para o Ryori. Não é o site oficial.</div>
<header class="topo"><a href="../" aria-label="Ryori, início"><span class="logo" style="--w:56px" aria-hidden="true"></span></a><div style="display:flex;gap:20px"><a class="sub" href="../" id="voltar-site">Site</a><button type="button" class="sub" id="lang" aria-label="Ver em inglês">EN</button></div></header>
<main class="pg">
  <div class="cab"><h1 class="display" id="tit">O seu lugar.</h1><p class="corrido-p" id="sub">Uma pergunta por vez. No fim, você escolhe o lugar na planta: no balcão, de frente para o sushiman, ou numa mesa.</p></div>
  <div id="reserva"></div>
</main>
<script src="../marca.js"></script>
<script src="../comum.js"></script>
<script src="../planta.js"></script>
<script src="../dados.js"></script>
<script src="../reserva.js"></script>
<script>
const reserva=Reserva.monta(document.getElementById('reserva'),{origem:'reservar'});
function aplicaLang(){const bl=document.getElementById('lang');bl.textContent=lang==='en'?'PT':'EN';bl.setAttribute('aria-label',lang==='en'?'Ver em português':'Ver em inglês');document.documentElement.lang=lang==='en'?'en':'pt-BR';
  document.getElementById('tit').textContent=L('O seu lugar.','Your seat.');document.getElementById('voltar-site').textContent=L('Site','Website');
  document.getElementById('sub').textContent=L('Uma pergunta por vez. No fim, você escolhe o lugar na planta: no balcão, de frente para o sushiman, ou numa mesa.','One question at a time. At the end, you pick your seat on the plan: at the counter, facing the sushi chef, or at a table.');reserva.pinta();}
document.getElementById('lang').addEventListener('click',()=>{setLang(lang==='en'?'pt':'en');aplicaLang();});
aplicaLang();
</script>
</body>
</html>
